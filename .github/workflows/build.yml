name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool libtool-bin \
            pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev \
            libssl-dev automake

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer
          pip install "cython==0.29.36"

      - name: Build APK
        run: |
          set +e
          yes | buildozer android debug > build.log 2>&1
          status=${PIPESTATUS[1]}

          echo "===== LAST 150 LINES ====="
          tail -n 150 build.log

          exit $status

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ecommerce-manager-apk
          path: bin/*.apk